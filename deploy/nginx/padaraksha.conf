# Padaraksha — NGINX reverse proxy config
# Place at: /etc/nginx/sites-available/padaraksha
# Enable:   sudo ln -s /etc/nginx/sites-available/padaraksha /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
#
# Prerequisites:
#   sudo certbot --nginx -d yourdomain.com
#   (certbot will auto-populate the ssl_certificate lines below)
#
# Ports used (no conflict with kk_v1):
#   Backend  → 127.0.0.1:8001
#   Frontend → 127.0.0.1:3001

# ---------------------------------------------------------------------------
# HTTP — redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com;

    # --- SSL (managed by certbot) ------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # --- Gzip ---------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    client_max_body_size 20M;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------
    # FastAPI backend — /api/ → 127.0.0.1:8001
    # /api/orders → http://127.0.0.1:8001/orders
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # Next.js static assets (content-hashed — long cache)
    # -----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------------------------------------------------
    # Next.js public/ assets
    # -----------------------------------------------------------------------
    location /public/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=86400";
    }

    # -----------------------------------------------------------------------
    # Next.js frontend (catch-all)
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
